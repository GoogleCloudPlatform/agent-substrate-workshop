  <circle cx="22" cy="24.5" r="5" fill="#1a73e8"/>
  <text class="title" x="36" y="29.5">Module 01 · Keyless Incident Actor and Governed Broker boundary</text>
  <rect class="pill-green" x="813" y="12.5" width="207" height="24" rx="12"/>
  <text class="pill-text-green" x="916.5" y="28.5" text-anchor="middle">0 credentials inside sandbox</text>
  <rect class="zone-red" x="20" y="64" width="356" height="346" rx="6"/>
  <text class="zone-title" x="34" y="86">Actor Boundary · keyless gVisor sandbox</text>
  <text class="zone-sub" x="34" y="102">ATESPACE: workshop-301 · WorkerPool/sre-workers</text>
  <rect class="card-red" x="34" y="114" width="328" height="86" rx="4"/>
  <text class="card-title" x="46" y="135">Incident Actor (inc-402 · sre-agent-v1)</text>
  <text class="mono" x="46" y="153">ADK Go v2 HTTP turn server (:80)</text>
  <text class="body" x="46" y="170">0 ambient GCP tokens, 0 API keys in env</text>
  <text class="mono-muted" x="46" y="187">clone_repo · read_file · ledger-verify</text>
  <rect class="card" x="34" y="212" width="328" height="72" rx="4"/>
  <text class="card-title" x="46" y="233">Durable /workspace git checkout</text>
  <text class="mono" x="46" y="251">/workspace/ledger-api (pool.yaml, store.go)</text>
  <text class="body" x="46" y="268">Persists staged fixes across turns</text>
  <rect class="card-green" x="34" y="296" width="328" height="72" rx="4"/>
  <text class="card-title" x="46" y="317">Cloud Storage snapshot (gs://PROJECT-ate)</text>
  <text class="body" x="46" y="335">Golden Snapshot boot in &lt; 400ms</text>
  <text class="mono-muted" x="46" y="352">Suspends to 0 vCPU after 15s idle</text>
  <rect class="pill-red" x="34" y="376" width="328" height="24" rx="12"/>
  <text class="pill-text-red" x="198.0" y="392.0" text-anchor="middle">Default-deny EgressPolicy: sre-gateway only</text>
  <rect class="zone-blue" x="412" y="64" width="316" height="346" rx="6"/>
  <text class="zone-title" x="426" y="86">Always-on routing &amp; broker tier</text>
  <text class="zone-sub" x="426" y="102">ate-system + workshop-301 namespaces</text>
  <rect class="card" x="426" y="114" width="288" height="86" rx="4"/>
  <text class="card-title" x="438" y="135">atenet-router (ate-system)</text>
  <text class="mono" x="438" y="153">mTLS podcert (:8443) + park budget</text>
  <text class="body" x="438" y="170">Wakes suspended Actors on demand</text>
  <text class="mono-muted" x="438" y="187">ate-target-actor: workshop-301/inc-402</text>
  <rect class="card-blue" x="426" y="218" width="288" height="146" rx="4"/>
  <text class="card-title" x="438" y="239">sre-gateway (Governed Broker)</text>
  <text class="body" x="438" y="257">Serves Cloud Console Incident Console</text>
  <text class="body" x="438" y="274">Attaches Workload Identity outside Actor</text>
  <text class="mono" x="438" y="291">/genai/* -&gt; Gemini Model Garden</text>
  <text class="mono" x="438" y="308">/ops/*   -&gt; Smart HTTP Git &amp; tickets</text>
  <text class="mono-muted" x="438" y="325">IDLE_AFTER=15s idle-suspender</text>
  <rect class="pill-blue" x="426" y="376" width="288" height="24" rx="12"/>
  <text class="pill-text-blue" x="570.0" y="392.0" text-anchor="middle">Workload Identity + podcert mTLS</text>
  <rect class="zone" x="764" y="64" width="256" height="346" rx="6"/>
  <text class="zone-title" x="778" y="86">Managed AI &amp; prod-sim</text>
  <text class="zone-sub" x="778" y="102">External to sandbox checkpoint</text>
  <rect class="card-blue" x="778" y="114" width="228" height="86" rx="4"/>
  <text class="card-title" x="790" y="135">Gemini on Agent Platform</text>
  <text class="mono" x="790" y="153">gemini-3.8-flash</text>
  <text class="body" x="790" y="170">Model Garden enterprise API</text>
  <text class="mono-muted" x="790" y="187">GOOGLE_GENAI_USE_ENTERPRISE</text>
  <rect class="card" x="778" y="214" width="228" height="88" rx="4"/>
  <text class="card-title" x="790" y="235">ops-hub (Operations Hub)</text>
  <text class="mono" x="790" y="253">/git/ledger-api.git</text>
  <text class="body" x="790" y="270">INC-402 &amp; INC-409 tracker</text>
  <text class="mono-muted" x="790" y="287">MCP + OAuth 2.0 in prod-sim</text>
  <rect class="card-amber" x="778" y="314" width="228" height="84" rx="4"/>
  <text class="card-title" x="790" y="335">ledger-api (Target Service)</text>
  <text class="mono" x="790" y="353">MAX_OPEN_CONNS=2 · 503</text>
  <text class="body" x="790" y="370">Unclosed row cursors in store.go</text>
  <text class="mono-muted" x="790" y="387">pool_exhausted JSON logs</text>
  <path class="edge" d="M 426 156 L 366 156" marker-end="url(#arrow-blue)"/>
  <text class="mono-muted" x="394" y="149" text-anchor="middle">mTLS</text>
  <path class="edge" d="M 362 250 L 422 250" marker-end="url(#arrow-blue)"/>
  <text class="mono-muted" x="392" y="243" text-anchor="middle">HTTP</text>
  <path class="edge" d="M 570 218 L 570 204" marker-end="url(#arrow-blue)"/>
  <path class="edge-green" d="M 198 284 L 198 294" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 714 248 L 746 248 L 746 158 L 774 158" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 714 278 L 774 278" marker-end="url(#arrow-blue)"/>
  <path class="edge-muted" d="M 892 302 L 892 312" marker-end="url(#arrow-muted)"/>
</svg>
