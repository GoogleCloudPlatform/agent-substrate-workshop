      .mono { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 400; fill: #202124; }
      .mono-muted { font-family: 'Roboto Mono', monospace; font-size: 10.5px; font-weight: 400; fill: #5f6368; }
      .pill-text-blue { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #1967d2; }
      .pill-text-green { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #137333; }
      .pill-text-amber { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #b06000; }
      .pill-text-red { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #c5221f; }
      .pill-text-neutral { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #3c4043; }
