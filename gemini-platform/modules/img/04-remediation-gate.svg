<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 436" width="100%" role="img" aria-label="Agent Registry A2A and MCP discovery paired with the zero-compute Remediation Gate suspend and resume flow">
  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .header-bar { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; }
      .zone { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; }
      .zone-blue { fill: #f4f8fe; stroke: #8ab4f8; stroke-width: 1; }
      .zone-green { fill: #f3faf5; stroke: #81c995; stroke-width: 1; }
      .zone-amber { fill: #fef9eb; stroke: #fdd663; stroke-width: 1; }
      .zone-red { fill: #fdf3f2; stroke: #f28b82; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .card { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .card-blue { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.25; }
      .card-green { fill: #ffffff; stroke: #188038; stroke-width: 1.25; }
      .card-amber { fill: #ffffff; stroke: #e37400; stroke-width: 1.25; }
      .card-red { fill: #ffffff; stroke: #d93025; stroke-width: 1.25; }
      .pill-blue { fill: #e8f0fe; stroke: #aecbfa; stroke-width: 1; }
      .pill-green { fill: #e6f4ea; stroke: #ceead6; stroke-width: 1; }
      .pill-amber { fill: #fef7e0; stroke: #fde293; stroke-width: 1; }
      .pill-red { fill: #fce8e6; stroke: #fad2cf; stroke-width: 1; }
      .pill-neutral { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1; }
      .title { font-family: Roboto, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #202124; }
      .zone-title { font-family: Roboto, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #202124; }
      .zone-sub { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #5f6368; }
      .card-title { font-family: Roboto, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #5f6368; }
      .mono { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 400; fill: #202124; }
      .mono-muted { font-family: 'Roboto Mono', monospace; font-size: 10.5px; font-weight: 400; fill: #5f6368; }
      .pill-text-blue { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #1967d2; }
      .pill-text-green { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #137333; }
      .pill-text-amber { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #b06000; }
      .pill-text-red { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #c5221f; }
      .pill-text-neutral { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #3c4043; }
      .edge { fill: none; stroke: #1a73e8; stroke-width: 1.5; }
      .edge-green { fill: none; stroke: #188038; stroke-width: 1.5; }
      .edge-amber { fill: none; stroke: #e37400; stroke-width: 1.5; }
      .edge-muted { fill: none; stroke: #5f6368; stroke-width: 1.4; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#188038"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e37400"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="1039" height="435" rx="6"/>
  <rect class="header-bar" x="0.5" y="0.5" width="1039" height="48" rx="6"/>
  <line x1="1" y1="48.5" x2="1039" y2="48.5" stroke="#dadce0" stroke-width="1"/>
  <circle cx="22" cy="24.5" r="5" fill="#1a73e8"/>
  <text class="title" x="36" y="29.5">Module 04 · Agent Registry (A2A &amp; MCP) and zero-compute Remediation Gate</text>
  <rect class="pill-amber" x="826" y="12.5" width="194" height="24" rx="12"/>
  <text class="pill-text-amber" x="923.0" y="28.5" text-anchor="middle">0 vCPU wait · &lt; 400ms wake</text>
  <rect class="zone-blue" x="20" y="62" width="1000" height="106" rx="6"/>
  <text class="zone-title" x="34" y="83">Agent Registry on Gemini Enterprise Agent Platform (GKE auto-discovery + MCP catalog)</text>
  <rect class="card-blue" x="34" y="94" width="316" height="62" rx="4"/>
  <text class="card-title" x="46" y="115">A2A Agent Card &amp; JSON-RPC (/a2a)</text>
  <text class="mono" x="46" y="133">/.well-known/agent-card.json</text>
  <rect class="card-green" x="366" y="94" width="308" height="62" rx="4"/>
  <text class="card-title" x="378" y="115">Telemetry MCP (readOnlyHint: true)</text>
  <text class="mono" x="378" y="133">logging-mcp · container-mcp</text>
  <rect class="card-amber" x="690" y="94" width="316" height="62" rx="4"/>
  <text class="card-title" x="702" y="115">Remediation MCP (destructiveHint: true)</text>
  <text class="mono" x="702" y="133">ops-hub-mcp · apply_remediation_pr</text>
  <rect class="zone" x="20" y="184" width="1000" height="236" rx="6"/>
  <text class="zone-title" x="34" y="206">Zero-compute Remediation Gate lifecycle across Actor Boundary (sre-agent-v4)</text>
  <rect class="card" x="34" y="220" width="226" height="152" rx="4"/>
  <text class="card-title" x="46" y="241">1. Triage &amp; stage fix</text>
  <text class="body" x="46" y="259">Queries MCP error logs</text>
  <text class="body" x="46" y="276">Patches pool.yaml + store.go</text>
  <text class="mono" x="46" y="293">ledger-verify -&gt; exit 0</text>
  <text class="mono" x="46" y="310">push_git_branch</text>
  <text class="mono-muted" x="46" y="327">fix/inc-402-pool-leak</text>
  <rect class="card-amber" x="282" y="220" width="226" height="152" rx="4"/>
  <text class="card-title" x="294" y="241">2. Confirmation gate</text>
  <text class="mono" x="294" y="259">apply_remediation_pr</text>
  <text class="body" x="294" y="276">RequireConfirmation: true</text>
  <text class="body" x="294" y="293">Emits confirmation event</text>
  <text class="body" x="294" y="310">to Gemini Sessions ledger</text>
  <text class="mono-muted" x="294" y="327">POST /turn exits cleanly</text>
  <rect class="card-blue" x="530" y="220" width="226" height="152" rx="4"/>
  <text class="card-title" x="542" y="241">3. Suspend to 0 vCPU</text>
  <text class="body" x="542" y="259">sre-gateway sees pending</text>
  <text class="body" x="542" y="276">gate and invokes:</text>
  <text class="mono" x="542" y="293">ateapi.SuspendActor</text>
  <text class="body" x="542" y="310">Checkpoints to GCS bucket</text>
  <text class="mono-muted" x="542" y="327">WorkerPool slot freed</text>
  <rect class="card-green" x="778" y="220" width="228" height="152" rx="4"/>
  <text class="card-title" x="790" y="241">4. Approve &amp; &lt; 400ms wake</text>
  <text class="body" x="790" y="259">Operator clicks Approve</text>
  <text class="body" x="790" y="276">atenet-router wakes inc-402</text>
  <text class="mono" x="790" y="293">/workspace intact (&lt; 400ms)</text>
  <text class="body" x="790" y="310">Merges PR-1 on ops-hub</text>
  <text class="mono-muted" x="790" y="327">ledger-api /healthz 200 OK</text>
  <rect class="pill-neutral" x="34" y="382" width="226" height="24" rx="12"/>
  <text class="pill-text-neutral" x="147.0" y="398.0" text-anchor="middle">Running on warm worker</text>
  <rect class="pill-amber" x="282" y="382" width="226" height="24" rx="12"/>
  <text class="pill-text-amber" x="395.0" y="398.0" text-anchor="middle">adk_request_confirmation</text>
  <rect class="pill-blue" x="530" y="382" width="226" height="24" rx="12"/>
  <text class="pill-text-blue" x="643.0" y="398.0" text-anchor="middle">Suspended · 0 vCPU in GCS</text>
  <rect class="pill-green" x="778" y="382" width="228" height="24" rx="12"/>
  <text class="pill-text-green" x="892.0" y="398.0" text-anchor="middle">Resolved · SLO restored</text>
  <path class="edge" d="M 260 296 L 278 296" marker-end="url(#arrow-blue)"/>
  <path class="edge-amber" d="M 508 296 L 526 296" marker-end="url(#arrow-amber)"/>
  <path class="edge-green" d="M 756 296 L 774 296" marker-end="url(#arrow-green)"/>
  <path class="edge-muted" d="M 520 156 L 520 182" marker-end="url(#arrow-muted)"/>
</svg>
