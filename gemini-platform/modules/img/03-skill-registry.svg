<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 428" width="100%" role="img" aria-label="Dynamic Procedural Skill rollout from Skill Registry into the Incident Actor workspace without Golden Snapshot churn">
  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .header-bar { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; }
      .zone { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; }
      .zone-blue { fill: #f4f8fe; stroke: #8ab4f8; stroke-width: 1; }
      .zone-green { fill: #f3faf5; stroke: #81c995; stroke-width: 1; }
      .zone-amber { fill: #fef9eb; stroke: #fdd663; stroke-width: 1; }
      .zone-red { fill: #fdf3f2; stroke: #f28b82; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .card { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .card-blue { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.25; }
      .card-green { fill: #ffffff; stroke: #188038; stroke-width: 1.25; }
      .card-amber { fill: #ffffff; stroke: #e37400; stroke-width: 1.25; }
      .card-red { fill: #ffffff; stroke: #d93025; stroke-width: 1.25; }
      .pill-blue { fill: #e8f0fe; stroke: #aecbfa; stroke-width: 1; }
      .pill-green { fill: #e6f4ea; stroke: #ceead6; stroke-width: 1; }
      .pill-amber { fill: #fef7e0; stroke: #fde293; stroke-width: 1; }
      .pill-red { fill: #fce8e6; stroke: #fad2cf; stroke-width: 1; }
      .pill-neutral { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1; }
      .title { font-family: Roboto, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #202124; }
      .zone-title { font-family: Roboto, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #202124; }
      .zone-sub { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #5f6368; }
      .card-title { font-family: Roboto, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #5f6368; }
      .mono { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 400; fill: #202124; }
      .mono-muted { font-family: 'Roboto Mono', monospace; font-size: 10.5px; font-weight: 400; fill: #5f6368; }
      .pill-text-blue { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #1967d2; }
      .pill-text-green { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #137333; }
      .pill-text-amber { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #b06000; }
      .pill-text-red { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #c5221f; }
      .pill-text-neutral { font-family: Roboto, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #3c4043; }
      .edge { fill: none; stroke: #1a73e8; stroke-width: 1.5; }
      .edge-green { fill: none; stroke: #188038; stroke-width: 1.5; }
      .edge-amber { fill: none; stroke: #e37400; stroke-width: 1.5; }
      .edge-muted { fill: none; stroke: #5f6368; stroke-width: 1.4; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#188038"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e37400"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="1039" height="427" rx="6"/>
  <rect class="header-bar" x="0.5" y="0.5" width="1039" height="48" rx="6"/>
  <line x1="1" y1="48.5" x2="1039" y2="48.5" stroke="#dadce0" stroke-width="1"/>
  <circle cx="22" cy="24.5" r="5" fill="#1a73e8"/>
  <text class="title" x="36" y="29.5">Module 03 · Procedural Skills via Skill Registry (v1 -&gt; v2 live rollout)</text>
  <rect class="pill-green" x="826" y="12.5" width="194" height="24" rx="12"/>
  <text class="pill-text-green" x="923.0" y="28.5" text-anchor="middle">Zero Golden Snapshot churn</text>
  <rect class="zone-blue" x="20" y="64" width="320" height="346" rx="6"/>
  <text class="zone-title" x="34" y="86">Skill Registry (Agent Platform)</text>
  <text class="zone-sub" x="34" y="102">agentregistry API · agentskills.io archive</text>
  <rect class="card" x="34" y="114" width="292" height="86" rx="4"/>
  <text class="card-title" x="46" y="135">ledger-pool-triage · Revision v1</text>
  <text class="mono" x="46" y="153">SKILL.md + scripts/diagnose_pool.sh</text>
  <text class="body" x="46" y="170">Checks config/pool.yaml baseline only</text>
  <text class="mono-muted" x="46" y="187">Immutable ZIP_STORED · SHA-256</text>
  <rect class="card-blue" x="34" y="214" width="292" height="104" rx="4"/>
  <text class="card-title" x="46" y="235">ledger-pool-triage · Revision v2</text>
  <text class="mono" x="46" y="253">defaultRevision = v2 (promoted live)</text>
  <text class="body" x="46" y="270">Scans pool/store.go for cursor leaks</text>
  <text class="mono" x="46" y="287">CURSOR_LEAK_DETECTED=true</text>
  <text class="mono-muted" x="46" y="304">make publish-skill REV=v2</text>
  <rect class="pill-blue" x="34" y="334" width="292" height="26" rx="13"/>
  <text class="pill-text-blue" x="180.0" y="351.0" text-anchor="middle">Zero container rebuild on runbook edit</text>
  <text class="body" x="180" y="382" text-anchor="middle">Versioned operational knowledge</text>
  <rect class="zone" x="372" y="64" width="256" height="346" rx="6"/>
  <text class="zone-title" x="386" y="86">sre-gateway broker</text>
  <text class="zone-sub" x="386" y="102">Keyless /agentregistry/skills proxy</text>
  <rect class="card" x="386" y="134" width="228" height="108" rx="4"/>
  <text class="card-title" x="398" y="155">Skill metadata &amp; archive sync</text>
  <text class="mono" x="398" y="173">GET /agentregistry/skills</text>
  <text class="body" x="398" y="190">Returns active defaultRevision</text>
  <text class="body" x="398" y="207">and expected 64-hex SHA-256</text>
  <text class="mono-muted" x="398" y="224">Streams .zip across boundary</text>
  <rect class="card" x="386" y="258" width="228" height="92" rx="4"/>
  <text class="card-title" x="398" y="279">Incident Console /catalog</text>
  <text class="body" x="398" y="297">Lists v1 &amp; v2 revision pills</text>
  <text class="body" x="398" y="314">Shows active SHA-256 digest</text>
  <text class="mono-muted" x="398" y="331">Inspect revisions drawer</text>
  <rect class="pill-neutral" x="386" y="366" width="228" height="24" rx="12"/>
  <text class="pill-text-neutral" x="500.0" y="382.0" text-anchor="middle">No GCP credentials in Actor</text>
  <rect class="zone-green" x="660" y="64" width="360" height="346" rx="6"/>
  <text class="zone-title" x="674" y="86">Resumed Incident Actor (sre-agent-v3)</text>
  <text class="zone-sub" x="674" y="102">ADK Go v2 SkillToolset + RegistrySkillSource</text>
  <rect class="pill-green" x="674" y="112" width="332" height="26" rx="13"/>
  <text class="pill-text-green" x="840.0" y="129.0" text-anchor="middle">Golden Snapshot tag: SNAP_BEFORE == SNAP_AFTER</text>
  <rect class="card" x="674" y="150" width="332" height="74" rx="4"/>
  <text class="card-title" x="686" y="171">1. Progressive prompt disclosure</text>
  <text class="mono" x="686" y="189">available_skills catalog -&gt; load_skill</text>
  <text class="body" x="686" y="206">Loads full SKILL.md only when relevant</text>
  <rect class="card-green" x="674" y="236" width="332" height="86" rx="4"/>
  <text class="card-title" x="686" y="257">2. In-memory SHA-256 &amp; archive guard</text>
  <text class="body" x="686" y="275">Verifies SHA-256 before touching /workspace</text>
  <text class="body" x="686" y="292">Blocks zip-slip, symlinks, &gt;64 files, &gt;10 MiB</text>
  <text class="mono" x="686" y="309">/workspace/.skills/ledger-pool-triage@v2</text>
  <rect class="card" x="674" y="334" width="332" height="64" rx="4"/>
  <text class="card-title" x="686" y="355">3. Sandboxed script execution</text>
  <text class="mono" x="686" y="373">sh .skills/.../diagnose_pool.sh</text>
  <text class="body" x="686" y="390">Runs inside gVisor on /workspace/ledger-api</text>
  <path class="edge" d="M 326 262 L 382 200" marker-end="url(#arrow-blue)"/>
  <path class="edge-green" d="M 614 190 L 670 190" marker-end="url(#arrow-green)"/>
  <path class="edge-green" d="M 614 210 L 670 274" marker-end="url(#arrow-green)"/>
</svg>
