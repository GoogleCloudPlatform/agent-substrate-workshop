  <rect class="pill-green" x="806" y="12.5" width="214" height="24" rx="12"/>
  <text class="pill-text-green" x="913.0" y="28.5" text-anchor="middle">4-rubric pure-Go Online Evals</text>
  <rect class="zone" x="20" y="64" width="286" height="352" rx="6"/>
  <text class="zone-title" x="34" y="86">1. Correlated W3C trace spans</text>
  <text class="zone-sub" x="34" y="102">traceparent: 00-traceId-spanId-01</text>
  <rect class="card-blue" x="34" y="114" width="258" height="88" rx="4"/>
  <text class="card-title" x="46" y="135">Governed Broker root spans</text>
  <text class="mono" x="46" y="153">invoke_gateway_turn (SERVER)</text>
  <text class="mono-muted" x="46" y="170">model_armor.screen</text>
  <text class="mono-muted" x="46" y="187">atenet.wake_and_route (CLIENT)</text>
  <rect class="card" x="34" y="214" width="258" height="96" rx="4"/>
  <text class="card-title" x="46" y="235">Keyless Incident Actor spans</text>
  <text class="mono" x="46" y="253">invoke_agent (SERVER)</text>
  <text class="mono-muted" x="46" y="270">execute_tool (INTERNAL)</text>
  <text class="mono-muted" x="46" y="287">Exports via /otlp/v1/traces</text>
  <rect class="card-green" x="34" y="322" width="258" height="78" rx="4"/>
  <text class="card-title" x="46" y="343">Lifecycle &amp; model child spans</text>
  <text class="mono-muted" x="46" y="361">genai.generate_content</text>
  <text class="mono-muted" x="46" y="378">auth_manager.inject_3lo</text>
  <text class="mono-muted" x="46" y="395">substrate.suspend_actor</text>
  <rect class="zone-blue" x="332" y="64" width="284" height="352" rx="6"/>
  <text class="zone-title" x="346" y="86">2. Broker scrubber &amp; metrics</text>
  <text class="zone-sub" x="346" y="102">sre-gateway telemetry pipeline</text>
  <rect class="card-red" x="346" y="114" width="256" height="134" rx="4"/>
  <text class="card-title" x="358" y="135">Inline OTel payload scrubber</text>
  <text class="body" x="358" y="153">Scrubs sensitive fields inline:</text>
  <text class="mono-muted" x="358" y="170">- Authorization &amp; Cookie headers</text>
  <text class="mono-muted" x="358" y="187">- ya29.* / gho_* / opshub_at_*</text>
  <text class="mono-muted" x="358" y="204">- Raw ADK tool_call_args</text>
  <text class="mono-muted" x="358" y="221">- Email / key / SSN PII patterns</text>
  <rect class="card-blue" x="346" y="262" width="256" height="102" rx="4"/>
  <text class="card-title" x="358" y="283">Cardinality boundary</text>
  <text class="body" x="358" y="301">Metrics group by ActorTemplate:</text>
  <text class="mono" x="358" y="318">template=&quot;sre-agent-v4&quot;</text>
  <text class="body" x="358" y="335">Never labels actor_id or session_id</text>
  <rect class="pill-blue" x="346" y="378" width="256" height="24" rx="12"/>
  <text class="pill-text-blue" x="474.0" y="394.0" text-anchor="middle">Safe for 10,000+ ephemeral Actors</text>
  <rect class="zone-green" x="642" y="64" width="378" height="352" rx="6"/>
  <text class="zone-title" x="656" y="86">3. Production observability &amp; eval flywheel</text>
  <text class="zone-sub" x="656" y="102">Metrics, traces, online rubrics &amp; drift detection</text>
  <rect class="card" x="656" y="112" width="350" height="66" rx="4"/>
  <text class="card-title" x="668" y="133">Managed Service for Prometheus (/metrics)</text>
  <text class="mono" x="668" y="151">PodMonitoring/sre-gateway (15s interval)</text>
  <text class="body" x="668" y="168">Turn latency, token counters, policy verdicts</text>
  <rect class="card-blue" x="656" y="188" width="350" height="66" rx="4"/>
  <text class="card-title" x="668" y="209">Google Cloud Trace &amp; Console waterfall</text>
  <text class="mono" x="668" y="227">gen_ai.system · gen_ai.agent.id · ate.actor.id</text>
  <text class="body" x="668" y="244">End-to-end latency &amp; wake breakdown per turn</text>
  <rect class="card-green" x="656" y="264" width="350" height="68" rx="4"/>
  <text class="card-title" x="668" y="285">Pure-Go Online Evals (make eval)</text>
  <text class="mono" x="668" y="303">cmd/evalrunner -&gt; Gemini autorater (4 rubrics)</text>
  <text class="body" x="668" y="320">Trajectory, skill v2, injection refusal, recall</text>
  <rect class="card-amber" x="656" y="342" width="350" height="64" rx="4"/>
  <text class="card-title" x="668" y="363">SCC Anomaly Detection (out-of-band)</text>
  <text class="mono" x="668" y="381">GKE_WORKLOAD logs + OTel GenAI spans</text>
  <text class="body" x="668" y="398">Flags OWASP ASI02/03/08/10 (0 ms inline lag)</text>
