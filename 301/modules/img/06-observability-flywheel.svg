<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 436" width="100%" role="img" aria-label="End-to-end W3C traceparent waterfall, secret scrubbing, Managed Prometheus metrics, pure-Go Online Evals, and SCC Anomaly Detection">
