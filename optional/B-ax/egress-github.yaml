# EgressPolicy for optional lab B step 5: allow git clone from GitHub over TLS passthrough.
# Unlike an `https:` rule (which terminates TLS at the egress gateway using egress-mitm.ate.dev),
# `tlsPassthrough:` forwards raw TLS on port 443 after checking the SNI hostname, so git/wget inside
# the alpine/git runner verify GitHub's certificate against the container's standard root CAs.
# Applied with: egressctl -a ax-workshop apply -f optional/B-ax/egress-github.yaml --actor=repo-task
rules:
- tlsPassthrough:
    hostnames:
    - "github.com"
    - "*.githubusercontent.com"
    ports:
      numbers: [443]
