# EgressPolicy for lab I's fetch1 actor: Module 4's gateway rule, plus one HTTPS host whose requests get their
# Authorization header replaced by the egress gateway. `effects` is a field of the https rule
# (HTTPSRule.effects in ateapi.proto), so it sits under `https:`, next to `hostnames`.
# Applied literally (not rendered): scripts/egress.sh apply optional/I-credential-injection/egress-fetch.yaml --actor=fetch1
rules:
- http:
    hostnames: ["gateway.workshop.svc.cluster.local"]
- https:
    hostnames: ["httpbin.org"]
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        credentialUri: ate-secret://k8s.io/default/workshop-secrets/example-api/token
